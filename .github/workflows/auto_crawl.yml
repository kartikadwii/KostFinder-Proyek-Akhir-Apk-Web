name: Auto Crawl Kos Yogyakarta & Retrain ML

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib playwright playwright-stealth
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler & retrain ML models
        run: |
          python crawl_jogja.py
          python train_models.py

      - name: Commit and push updated data & models
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dataset_kos_yogyakarta.csv models/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update dataset and ML models [skip ci]" && git push)
